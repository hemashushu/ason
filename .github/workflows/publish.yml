name: Publish

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test
        run: cargo test --all-targets

      - name: Package
        run: cargo package

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail

          version="$(cargo metadata --no-deps --format-version 1 | jq -er '.packages[] | select(.name == "ason") | .version')"
          status="$(curl --silent --show-error --location --retry 3 \
            --user-agent "ason-publish-workflow" \
            --output /dev/null --write-out '%{http_code}' \
            "https://crates.io/api/v1/crates/ason/${version}")"

          case "$status" in
            200)
              echo "ason ${version} is already published; skipping."
              ;;
            404)
              cargo publish
              ;;
            *)
              echo "Failed to check ason ${version} on crates.io: HTTP ${status}" >&2
              exit 1
              ;;
          esac