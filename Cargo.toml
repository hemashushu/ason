[package]
name = "ason"
version = "4.1.1"
edition = "2024"

license-file = "LICENSE.additional"
description = "ASON is a strongly typed, JSON-like data format for AI agents, tools, and people, with explicit numeric types and native enumerations."
repository = "https://github.com/hemashushu/ason"
keywords = ["ason", "serde", "serialization", "data-format", "ai-agent"]
categories = ["encoding", "parsing"]

[dependencies]
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
hexfloat2 = "0.2"

[dev-dependencies]
pretty_assertions = "1.4"
